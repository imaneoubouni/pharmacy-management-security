<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Médicaments</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <h2>Liste des médicaments</h2>

    <table border="1" cellpadding="6">
        <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Description</th>
            <th>Prix (DH)</th>
            <th>Stock</th>
            <th sec:authorize="hasAnyRole('ADMIN','PHARMACIEN')">
                Modifier le stock
            </th>
            <th sec:authorize="hasRole('ADMIN')">
                Supprimer
            </th>
        </tr>

        <tr th:each="m : ${medicaments}">
            <td th:text="${m.id}"></td>
            <td th:text="${m.nom}"></td>
            <td th:text="${m.description}"></td>
            <td th:text="${m.prix}"></td>
            <td th:text="${m.stock}"></td>

            <td sec:authorize="hasAnyRole('ADMIN','PHARMACIEN')">
                <form th:action="@{'/medicaments/stock/' + ${m.id}}"
                      method="post">
                    <input type="number" name="stock"
                           th:value="${m.stock}" min="0" required>
                    <button type="submit">Modifier</button>
                </form>
            </td>

            <td sec:authorize="hasRole('ADMIN')">
                <form th:action="@{'/medicaments/supprimer/' + ${m.id}}"
                      method="post">
                    <button type="submit">Supprimer</button>
                </form>
            </td>
        </tr>
    </table>

    <div sec:authorize="hasRole('ADMIN')">
        <h3>Ajouter un médicament</h3>

        <form th:action="@{/medicaments/ajouter}"
              th:object="${nouveau}" method="post">

            <input type="text" th:field="*{nom}"
                   placeholder="Nom" required>

            <input type="text" th:field="*{description}"
                   placeholder="Description">

            <input type="number" th:field="*{prix}"
                   min="0" step="0.01" placeholder="Prix" required>

            <input type="number" th:field="*{stock}"
                   min="0" placeholder="Stock" required>

            <button type="submit">Ajouter</button>
        </form>
    </div>

    <p><a th:href="@{/home}">Retour à l'accueil</a></p>
</body>
</html>
